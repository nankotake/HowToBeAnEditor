<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剪单人生 · Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="menubar">
      <span class="brand">剪单人生<span class="demo-tag">DEMO</span></span>
      <div id="menus">
        <span class="menu-item">文件</span>
        <span class="menu-item">编辑</span>
        <span class="menu-item">修剪</span>
        <span class="menu-item">时间线</span>
        <span class="menu-item">片段</span>
        <span class="menu-item">标记</span>
        <span class="menu-item">显示</span>
        <span class="menu-item">播放</span>
        <span class="menu-item">工作区</span>
        <span class="menu-item">帮助</span>
      </div>
    </div>
    <header id="topbar">
      <nav id="pages">
        <button class="page-tab">素材库</button>
        <button class="page-tab active">剪辑</button>
        <button class="page-tab">调色</button>
        <button class="page-tab">交付</button>
      </nav>
      <div class="tools">
        <button id="tool-select" class="tool-btn active" data-tool="select">选择</button>
        <button id="tool-blade" class="tool-btn" data-tool="blade">刀片</button>
        <span class="tool-sep"></span>
        <button id="btn-cut" class="tool-btn">分割</button>
        <button id="btn-delete" class="tool-btn">删除</button>
      </div>
      <button id="btn-deliver" class="deliver-btn">交付</button>
    </header>

    <main id="main">
      <aside id="media-pool">
        <h2>素材库 <span class="en">Media</span></h2>
        <p class="hint">点击加入时间线，或直接拖进去</p>
        <div id="media-list"></div>
      </aside>

      <section id="center">
        <div id="preview-wrap">
          <div id="preview-stage">
            <div id="scene"></div>
            <div id="guides" hidden></div>
          </div>
          <div id="brief">
            <div id="brief-header"></div>
            <div id="brief-text"></div>
            <div id="brief-checks"></div>
          </div>
        </div>
        <div id="transport">
          <button id="btn-start" title="跳到开头">⏮</button>
          <button id="btn-prev" title="上一帧">‹</button>
          <button id="btn-play">▶</button>
          <button id="btn-next-f" title="下一帧">›</button>
          <button id="btn-end" title="跳到结尾">⏭</button>
          <span id="time-label">00:00:00:00 / 00:00:00:00</span>
          <span id="dur-hint">空格 播放/暂停 · 点击标尺定位</span>
        </div>
      </section>

      <aside id="inspector">
        <h2>检查器 <span class="en">Inspector</span></h2>
        <div id="insp-empty" class="hint">选中时间线上的素材开始处理</div>
        <div id="insp-body" hidden>
          <div id="insp-name"></div>
          <div class="insp-section">
            <h3>调色 <span class="en">Color</span></h3>
            <div id="filter-btns"></div>
          </div>
          <div class="insp-section">
            <h3>构图 <span class="en">Transform</span></h3>
            <p class="mini-hint">拖动画面找好构图，靠近居中/三分线自动吸附</p>
            <div id="comp-tools">
              <button id="btn-center">居中</button>
              <input id="scale-slider" type="range" min="100" max="240" step="5" value="140">
              <span id="scale-label">140%</span>
            </div>
          </div>
          <div class="insp-section">
            <h3>节奏点 <span class="en">Markers</span></h3>
            <div id="marker-chips" class="mini-hint"></div>
          </div>
        </div>
      </aside>
    </main>

    <section id="timeline-panel">
      <div id="tl-head">
        <span>时间线 <span class="en">Timeline</span></span>
        <span id="tl-zoom">点击标尺可吸附节奏点 · 拖动片段边缘裁剪</span>
      </div>
      <div id="ruler-wrap">
        <div id="ruler"></div>
        <div id="playhead"><div class="ph-knob"></div></div>
      </div>
      <div id="track-area">
        <div id="track-label">V1</div>
        <div id="track"></div>
        <div id="drop-hint">把素材拖到这里 🎬</div>
      </div>
    </section>

    <footer id="statusbar">
      <span id="st-client"></span>
      <span class="sep">│</span>
      <span id="st-duration"></span>
      <span class="sep">│</span>
      <span id="st-budget"></span>
      <span class="sep">│</span>
      <span id="st-anomaly"></span>
      <span class="right">1920×1080 · 25fps</span>
    </footer>
  </div>

  <div id="toast-layer"></div>

  <div id="deliver-overlay" hidden>
    <div id="deliver-box">
      <div id="deliver-progress-wrap"><div id="deliver-progress"></div></div>
      <div id="deliver-result" hidden>
        <div id="grade"></div>
        <div id="score-line"></div>
        <div id="client-line"></div>
        <div id="detail-line"></div>
        <div class="result-btns">
          <button id="btn-retry">重剪</button>
          <button id="btn-next">重新开始</button>
        </div>
      </div>
    </div>
  </div>

  <script src="media.js"></script>
  <script src="app.js"></script>
</body>
</html>
